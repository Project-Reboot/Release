[package]
name = "project-reboot-launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "ProjectRebootLauncher"
path = "src/main.rs"

[lib]
name = "launcher"
path = "src/lib.rs"

[dependencies]
pr-manifest.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
getrandom.workspace = true
ureq = { version = "2", features = ["json"] }
url = "2"
base64 = "0.22"
open = "5"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
rfd = "0.18"
zstd = "0.14.4"
openh264 = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[build-dependencies]
winresource = "0.1"
