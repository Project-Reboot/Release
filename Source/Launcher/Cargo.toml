[workspace]
resolver = "2"
members = ["manifest", "launcher"]

[workspace.package]
version = "0.3.1"
edition = "2021"
publish = false

[workspace.dependencies]
pr-manifest = { path = "manifest" }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
