name: Mac launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Source/Launcher
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Source/Launcher
          persist-credentials: false

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Add the button font
        env:
          BUTTON_FONT: ${{ secrets.BUTTON_FONT }}
        run: |
          if [ -n "$BUTTON_FONT" ]; then
            mkdir -p assets/fonts
            printf '%s' "$BUTTON_FONT" | base64 --decode > assets/fonts/blocktopia.ttf
          fi

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          sep=$(printf '\037')
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$HOME=/home${sep}--remap-path-prefix=$PWD=/launcher"
          cargo build --release --locked -p project-reboot-launcher --target aarch64-apple-darwin
          cargo build --release --locked -p project-reboot-launcher --target x86_64-apple-darwin

      - name: Make the app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="dist/Project Reboot Launcher.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/ProjectRebootLauncher" \
            target/aarch64-apple-darwin/release/ProjectRebootLauncher \
            target/x86_64-apple-darwin/release/ProjectRebootLauncher
          chmod 755 "$app/Contents/MacOS/ProjectRebootLauncher"
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon-source.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double assets/icon-source.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Project Reboot Launcher</string>
            <key>CFBundleDisplayName</key><string>Project Reboot Launcher</string>
            <key>CFBundleIdentifier</key><string>com.rebootteam.launcher</string>
            <key>CFBundleExecutable</key><string>ProjectRebootLauncher</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/ProjectRebootLauncher"
          cp "$app/Contents/MacOS/ProjectRebootLauncher" dist/ProjectRebootLauncher
          (cd dist && ditto -c -k --keepParent "Project Reboot Launcher.app" ProjectRebootLauncher-macOS.zip)
          printf '%s\n' "$version" > dist/version.txt
          shasum -a 256 dist/ProjectRebootLauncher dist/ProjectRebootLauncher-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-launcher
          path: |
            Source/Launcher/dist/ProjectRebootLauncher
            Source/Launcher/dist/ProjectRebootLauncher-macOS.zip
            Source/Launcher/dist/version.txt
          retention-days: 7
          if-no-files-found: error
